<!DOCTYPE html>
<html>
<head>
  <title>Calculate Change</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input, button {
      padding: 6px;
      margin: 5px;
    }
  </style>
</head>
<body>
  <h2>Calculate Change (฿)</h2>

  <label>Enter Amount:</label>
  <input type="number" id="amount" placeholder="Enter amount">
  <button onclick="calculateChange()">Submit</button>

  <div id="result"></div>

  <script>
    function calculateChange() {
      let amount = parseInt(document.getElementById("amount").value);
      let denominations = [500, 100, 50, 20, 10, 5, 1];
      let result = "";

      for (let i = 0; i < denominations.length; i++) {
        let count = Math.floor(amount / denominations[i]);
        if (count > 0) {
          result += `${count} × ฿${denominations[i]}<br>`;
          amount %= denominations[i];
        }
      }

      document.getElementById("result").innerHTML = result;
    }
  </script>
</body>
</html>
