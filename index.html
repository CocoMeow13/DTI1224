<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DTI224 Assignments</title>
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: url('https://images.unsplash.com/photo-1501594907352-04cda38ebc29') no-repeat center center fixed;
      background-size: cover;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(90deg, #ff00ff, #00fff7);
      padding: 20px;
      text-align: center;
      color: #0d0d0d;
      text-shadow: 0 0 10px #000;
    }
    header h1 {
      font-size: 2.5em;
      margin: 0;
      letter-spacing: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .card {
      background-color: rgba(20,20,20,0.85);
      border: 2px solid #ff00ff;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 15px #ff00ff, 0 0 30px #00fff7;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #ff00ff, 0 0 50px #00fff7;
    }
    .card h2 {
      color: #00fff7;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00fff7;
    }
    .card p {
      color: #cccccc;
      margin-bottom: 15px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      color: #0d0d0d;
      background: linear-gradient(90deg, #ff00ff, #00fff7);
      border: none;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .btn:hover {
      background: linear-gradient(90deg, #00fff7, #ff00ff);
      box-shadow: 0 0 20px #ff00ff, 0 0 40px #00fff7;
    }
  </style>
</head>
<body>
  <header>
    <h1>DTI1224 Assignments</h1>
  </header>

  <div class="grid">
    <div class="card">
      <h2>My Resume</h2>
      <p>View my personal resume.</p>
      <a href="sithuKhantresume.html" class="btn">View Resume</a>
    </div>
    <div class="card">
      <h2>Change</h2>
      <a href="change.html" class="btn">View</a>
    </div>
    <div class="card">
      <h2>Grade</h2>
      <a href="grade.html" class="btn">View</a>
    </div>
    <div class="card">
      <h2>Unit Converter</h2>
      <a href="converter.html" class="btn">View</a>
    </div>
    <div class="card">
      <h2>Distance</h2>
      <a href="distance.html" class="btn">View</a>
    </div>
  </div>
</body>
</html>
