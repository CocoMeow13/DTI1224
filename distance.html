<!DOCTYPE html>
<html>
<head>
  <title>Distance from University</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    input { margin: 5px; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>How far from University?</h2>
  <label for="x">Enter x:</label>
  <input type="number" id="x" placeholder="x coordinate"><br>
  <label for="y">Enter y:</label>
  <input type="number" id="y" placeholder="y coordinate"><br>
  <button onclick="calculateDistance()">Calculate</button>
  <button onclick="goBack()">Back</button>
  <p id="result"></p>
  <p id="error" class="error"></p>

  <script>
    function calculateDistance() {
      const x = document.getElementById('x').value;
      const y = document.getElementById('y').value;
      const error = document.getElementById('error');
      const result = document.getElementById('result');

      // Validation
      if (x === '' || y === '') {
        error.textContent = 'Please enter both x and y values.';
        result.textContent = '';
        return;
      }

      error.textContent = '';
      const distance = Math.sqrt(x*x + y*y);
      result.textContent = `Distance = ${distance.toFixed(2)} units`;
    }

    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
